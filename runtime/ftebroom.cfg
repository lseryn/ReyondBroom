plug_load ftebroom
bind F1 ftebroom
set ca_show 1
set ca_editormode 4
set ca_grid 16
set ca_newbrushtexture ftebroom/grid
r_fullbright 1
vid_conautoscale 1
mapedit maps/start.map
bind ctrl+z brushedit_undo
bind ctrl+y brushedit_redo
bind w +forward
bind s +back
bind a +moveleft
bind d +moveright
in 5 setpos 320 -400 280 25 130 0
in 6 ftebroom
set ftebroom_tool 0
set ftebroom_plane 0
set ftebroom_forward 0
set ftebroom_right 0
set ftebroom_grid_visible 1
set ftebroom_mouse_x 640
set ftebroom_mouse_y 400
set ftebroom_alt 0
set ftebroom_selection_count 0
