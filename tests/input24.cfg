exec ftebroom.cfg
set ftebroom_skip_setup 1
in 7 ftebroom_box 0 0 128 64 64 64
in 8 ftebroom_test_filepath materialtab
in 10 ftebroom_test_filepath materialclick sx
in 11 ftebroom_test_filepath event ctrl 1 950 300
in 11.2 ftebroom_test_filepath event a 1 950 300
in 11.3 ftebroom_test_filepath event a 2 950 300
in 11.4 ftebroom_test_filepath event ctrl 2 950 300
in 12 ftebroom_test_filepath uitext "0.375"
in 13 ftebroom_test_filepath materialclick sy
in 14 ftebroom_scale_x
in 14.5 screenshot scale-input.png
in 15 ftebroom_test_filepath event ctrl 1 950 330
in 15.2 ftebroom_test_filepath event a 1 950 330
in 15.3 ftebroom_test_filepath event a 2 950 330
in 15.4 ftebroom_test_filepath event ctrl 2 950 330
in 16 ftebroom_test_filepath uitext "1.75"
in 17 ftebroom_test_filepath materialclick angle
in 18 ftebroom_scale_y
in 19 screenshot scale-both.png
in 20 quit force
