exec ftebroom.cfg
set ftebroom_skip_setup 1
in 7 ftebroom_test_pick setup
in 8 mod_terrain_save "" pick_before
in 9 ftebroom_test_pick query
in 9.5 ftebroom_test_pick click
in 10 mod_terrain_save "" pick_after
