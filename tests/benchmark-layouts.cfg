exec ftebroom.cfg
set ftebroom_skip_setup 1
set cl_maxfps 250
set cl_idlefps 250
set vid_vsync 0
in 7 mapedit maps/qa_2000.map
in 10 set ftebroom_view_layout 4
in 10 set ca_brush_viewsize 2048
in 10 setpos 2000 -2400 1800 25 130 0
in 12 set ftebroom_benchmark 1
in 22 screenshot layouts-2000.png
in 23 set ftebroom_grid_visible 0
in 24 set ftebroom_benchmark 1
in 34 quit force

