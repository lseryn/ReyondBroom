exec ftebroom.cfg
set ftebroom_skip_setup 1
set ftebroom_view_layout 1
in 7 mapedit maps/bounds66-0.map
in 8 ftebroom_select all
in 9 ftebroom_group Occlusion_fixture
in 10 ftebroom_deselect
in 10.2 set ftebroom_show_group_bounds 1
in 10.3 set ftebroom_show_brush_entity_bounds 0
in 10.4 set ftebroom_show_entity_names 0
in 11 ftebroom_camera_restore 0 -256 64 0 90 0 90
in 12 screenshot bounds66-exposed.png
in 13 set ca_newbrushtexture ftebroom/qa_green
in 14 ftebroom_box 0 -56 64 512 16 384
in 15 ftebroom_deselect
in 18 ftebroom_document_dump
in 19 screenshot bounds66-covered.png
in 21 quit force
