exec ftebroom.cfg
set ftebroom_skip_setup 1
in 7 ftebroom_box 0 0 64 128 128 128
in 8 mod_terrain_save "" preview_start
in 9 ftebroom_test_drag clip
in 10 set ftebroom_clip_keep 1
in 11 screenshot preview_front.png
in 12 ftebroom_test_key Ctrl+enter
in 13 screenshot preview_back.png
in 14 ftebroom_tool_deactivate
in 15 ftebroom_test_drag pending
in 16 screenshot preview_move.png
in 17 ftebroom_cancel
in 18 screenshot preview_cancel.png
in 19 mod_terrain_save "" preview_cancel
in 20 quit force
