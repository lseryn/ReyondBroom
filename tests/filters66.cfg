exec ftebroom.cfg
set ftebroom_skip_setup 1
in 8 echo FTEBROOM_FILTERS_BEGIN
in 8 vid_multisample
in 8 ftebroom_grid_aa
in 8 gl_texture_anisotropy
in 8 gl_texturemode
in 9 echo FTEBROOM_FILTERS_END
in 10 set vid_multisample 2
in 10 set ftebroom_grid_aa 0.75
in 10 set gl_texture_anisotropy 4
in 10 set gl_texturemode GL_LINEAR_MIPMAP_LINEAR
in 11 saveconfig config.cfg
in 12 quit
